name: Inalpha E1 Statistical Correction Trace

on:
  workflow_dispatch:

env:
  INALPHA_REVISION: 3da8b103d61fc3c6af82ea479beade0cd7436e57

jobs:
  static-trace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: ${{ env.INALPHA_REVISION }}
          path: inalpha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paper dependencies
        working-directory: inalpha/services/paper
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Install evolver dependencies
        working-directory: inalpha/services/evolver
        run: |
          uv sync

      - name: Trace E1 statistical call sites
        working-directory: inalpha
        run: |
          PYTHONPATH="services/paper/src:services/evolver/src" \
          python - <<'PY'
          from pathlib import Path

          targets = {
              "generation.py":
                  Path("services/evolver/src/inalpha_evolver/runtime/generation.py"),
              "slots.py":
                  Path("services/evolver/src/inalpha_evolver/runtime/slots.py"),
              "strategy_evaluation.py":
                  Path("services/paper/src/inalpha_paper/strategy_evaluation.py"),
              "backtest.py":
                  Path("services/paper/src/inalpha_paper/engine/backtest.py"),
          }

          needles = [
              "run_cv_backtest",
              "probability_of_backtest_overfitting",
              "deflated_sharpe_ratio",
              "n_strategies",
              "trial_count",
              "candidate_count",
              "num_candidates",
              "search_count",
              "n_trials",
          ]

          print("=== E1 STATISTICAL CORRECTION TRACE ===")

          for name, path in targets.items():
              source = path.read_text()

              print(f"\n--- {name} ---")

              for needle in needles:
                  matches = [
                      (i + 1, line.strip())
                      for i, line in enumerate(source.splitlines())
                      if needle in line
                  ]

                  if matches:
                      print(f"{needle}:")
                      for line_no, line in matches:
                          print(f"  {line_no}: {line}")
                  else:
                      print(f"{needle}: NONE")

          print("\nStatic trace complete.")
          PY

      - name: Inspect evaluator API
        working-directory: inalpha
        run: |
          PYTHONPATH="services/paper/src" \
          python - <<'PY'
          import inspect

          from inalpha_paper.strategy_evaluation import evaluate_strategy_source

          signature = inspect.signature(evaluate_strategy_source)

          print("=== evaluate_strategy_source ===")
          print(signature)

          forbidden = {
              "n_strategies",
              "trial_count",
              "candidate_count",
              "num_candidates",
              "search_count",
              "n_trials",
          }

          exposed = sorted(
              forbidden.intersection(signature.parameters)
          )

          print()
          print("Evolutionary trial-count parameters:")
          print(exposed if exposed else "NONE")
          PY

  managed-trace:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quant -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      INALPHA_REVISION: 3da8b103d61fc3c6af82ea479beade0cd7436e57
      DATABASE_URL: postgresql+psycopg://quant:devpass@localhost:5433/inalpha_test
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: inalpha_test

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: ${{ env.INALPHA_REVISION }}
          path: inalpha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for TimescaleDB
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5433 -U quant && exit 0
            sleep 2
          done
          exit 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h 127.0.0.1 \
            -p 5433 \
            -U "$POSTGRES_USER" \
            -d postgres \
            -c "CREATE DATABASE inalpha_test;"

      - name: Install evolver dependencies
        working-directory: inalpha/services/evolver
        run: |
          pip install uv
          uv sync

      - name: Install paper dependencies
        working-directory: inalpha/services/paper
        run: |
          uv sync

      - name: Run Inalpha migrations
        working-directory: inalpha/services/evolver
        run: |
          uv run alembic -c alembic.ini upgrade head

      - name: Verify database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -h 127.0.0.1 \
            -p 5433 \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "\dt"

      - name: Prepare multi-candidate harness
        run: |
          test -f experiments/inalpha/tests/e1_managed_run.py
          cp experiments/inalpha/tests/e1_managed_run.py \
             /tmp/e1_managed_run.py

      - name: Run managed E1 statistical trace
        run: |
          echo "=== MULTI-CANDIDATE E1 TRACE ==="
          echo
          echo "The managed harness must execute E1 with:"
          echo "  budget > 1"
          echo "  deterministic mutation"
          echo "  controlled FrozenDataset"
          echo "  real execute_frozen_run()"
          echo
          echo "The next harness revision will record:"
          echo "  candidate count"
          echo "  candidate evaluation snapshots"
          echo "  overfitting-risk values"
          echo "  statistical fields"
          echo "  CV/DSR/PBO evidence"
          echo
          echo "Stopping before claiming runtime statistical invocation."
          exit 1