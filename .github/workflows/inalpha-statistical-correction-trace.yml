name: Inalpha E1 Statistical Correction Trace

on:
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quant -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      INALPHA_REVISION: 3da8b103d61fc3c6af82ea479beade0cd7436e57
      DATABASE_URL: postgresql+psycopg://quant:devpass@localhost:5433/inalpha_test
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: inalpha_test

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: ${{ env.INALPHA_REVISION }}
          path: inalpha

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for TimescaleDB
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5433 -U quant && exit 0
            sleep 2
          done
          exit 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
            -h 127.0.0.1 \
            -p 5433 \
            -U "$POSTGRES_USER" \
            -d postgres \
            -c "CREATE DATABASE inalpha_test;"

      - name: Install paper dependencies
        working-directory: inalpha/services/paper
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Install evolver dependencies
        working-directory: inalpha/services/evolver
        run: |
          uv sync

      - name: Run migrations
        working-directory: inalpha
        run: |
          cd services/evolver
          uv run alembic upgrade head

      - name: Static trace of E1 statistical call sites
        working-directory: inalpha
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              "generation.py":
                  Path("services/evolver/src/inalpha_evolver/runtime/generation.py"),
              "slots.py":
                  Path("services/evolver/src/inalpha_evolver/runtime/slots.py"),
              "strategy_evaluation.py":
                  Path("services/paper/src/inalpha_paper/strategy_evaluation.py"),
              "backtest.py":
                  Path("services/paper/src/inalpha_paper/engine/backtest.py"),
          }

          needles = [
              "run_cv_backtest",
              "probability_of_backtest_overfitting",
              "deflated_sharpe_ratio",
              "n_strategies",
              "trial_count",
              "candidate_count",
              "num_candidates",
              "search_count",
              "n_trials",
          ]

          print("=== Static Statistical Correction Trace ===")

          for name, path in files.items():
              text = path.read_text()
              print(f"\n--- {name} ---")

              for needle in needles:
                  matches = [
                      line.strip()
                      for line in text.splitlines()
                      if needle in line
                  ]

                  if matches:
                      print(f"{needle}:")
                      for line in matches:
                          print(f"  {line}")
                  else:
                      print(f"{needle}: NONE")

          print("\nStatic inspection complete.")
          PY

      - name: Inspect E1 evaluator signature
        working-directory: inalpha
        run: |
          PYTHONPATH=services/paper/src \
          python - <<'PY'
          import inspect
          from inalpha_paper.strategy_evaluation import evaluate_strategy_source

          print("=== evaluate_strategy_source signature ===")
          print(inspect.signature(evaluate_strategy_source))

          signature = inspect.signature(evaluate_strategy_source)

          forbidden = {
              "n_strategies",
              "trial_count",
              "candidate_count",
              "num_candidates",
              "search_count",
              "n_trials",
          }

          exposed = sorted(forbidden.intersection(signature.parameters))

          print()
          print("Evolutionary trial-count parameters exposed:")
          print(exposed if exposed else "NONE")
          PY

      - name: Run multi-candidate E1 managed trace
        working-directory: testing-ground
        run: |
          echo "Managed multi-candidate E1 execution trace placeholder."
          echo "The real harness must:"
          echo "1. create one managed run with budget > 1"
          echo "2. use the deterministic mutator"
          echo "3. use the controlled FrozenDataset"
          echo "4. execute real execute_frozen_run()"
          echo "5. preserve all candidate snapshots"
          echo "6. record whether CV/DSR/PBO paths are invoked"
          echo
          echo "This workflow intentionally fails until the harness is added."
          exit 1