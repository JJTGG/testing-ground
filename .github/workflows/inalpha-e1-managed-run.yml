name: Inalpha E1 Managed Run

on:
  workflow_dispatch:

jobs:
  managed-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U quant -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: 3da8b103d61fc3c6af82ea479beade0cd7436e57
          path: inalpha

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install migration dependencies
        working-directory: inalpha
        run: |
          uv sync --directory infra/migrations

      - name: Create disposable test database
        env:
          PGPASSWORD: devpass
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5433 \
            -U quant \
            -d postgres \
            -c "CREATE DATABASE inalpha_test;"

      - name: Run Inalpha migrations
        working-directory: inalpha
        env:
          DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
        run: |
          uv run --directory infra/migrations alembic upgrade head

      - name: Install Evolver dependencies
        working-directory: inalpha/services/evolver
        env:
          DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
        run: |
          uv sync

      - name: Create managed-run harness
        working-directory: inalpha/services/evolver
        run: |
          cat > /tmp/inalpha_e1_managed_run.py <<'PY'
          from __future__ import annotations

          import asyncio
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from uuid import uuid4

          from inalpha_evolver.db import get_conn
          from inalpha_evolver.runtime.executor import execute_frozen_run
          from inalpha_evolver.storage import candidates, runs, run_queries
          from inalpha_evolver.runtime.frozen_dataset import FrozenDataset


          TESTING_GROUND_REVISION = os.environ["TESTING_GROUND_REVISION"]
          INALPHA_REVISION = os.environ["INALPHA_REVISION"]
          WORKFLOW_RUN = os.environ.get("GITHUB_RUN_ID", "unknown")


          class DeterministicMutator:
              def __init__(self):
                  self.calls = 0

              async def mutate(self, source, report, hint):
                  self.calls += 1
                  return {
                      "source": source,
                      "diff": "",
                      "usage": {
                          "input_tokens": 0,
                          "output_tokens": 0,
                          "cache_hit_tokens": 0,
                          "llm_cost_usd": 0.0,
                      },
                  }


          def build_dataset() -> FrozenDataset:
              bars = []

              base_ts = 1767438000000

              for index in range(60):
                  bars.append(
                      {
                          "timestamp": base_ts + index * 60 * 60 * 1000,
                          "open": 100.0 + index * 0.1,
                          "high": 100.5 + index * 0.1,
                          "low": 99.5 + index * 0.1,
                          "close": 100.2 + index * 0.1,
                          "volume": 1000.0 + index,
                      }
                  )

              canonical = json.dumps(
                  bars,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode()

              content_hash = hashlib.sha256(canonical).hexdigest()

              return FrozenDataset(
                  bars=bars,
                  venue="binance",
                  symbol="BTCUSDT",
                  timeframe="1h",
                  from_ts=bars[0]["timestamp"],
                  as_of=bars[-1]["timestamp"],
                  data_epoch=bars[0]["timestamp"],
                  content_sha256=content_hash,
              )


          def build_seed_source() -> str:
              return """from inalpha_paper.strategy_authoring.types import Strategy

          class StrategyImpl(Strategy):
              def on_bar(self, ctx):
                  return None
          """


          async def main():
              dataset = build_dataset()
              seed_source = build_seed_source()
              mutator = DeterministicMutator()

              run_id = uuid4()

              llm_config_digest = (
                  "e6edd79eabdccaed743ac72ddeb8ff4d5de550a742e9e931d368c93caf1cca4c"
              )

              llm_snapshot = {
                  "config_id": "config-1",
                  "provider": "deepseek",
                  "model": "deepseek-flash",
                  "base_url": "https://api.deepseek.com",
                  "pricing": {
                      "version": "provider-estimate-2026-09",
                      "currency": "USD",
                      "input_usd_per_million": 0.3,
                      "output_usd_per_million": 1.2,
                      "assumed_input_tokens": 24000,
                      "max_output_tokens": 8192,
                      "estimated_max_usd_per_candidate": 0.0170304,
                  },
                  "config_digest": llm_config_digest,
              }

              run = {
                  "run_id": run_id,
                  "owner_account_id": uuid4(),
                  "status": "queued",
                  "stage": "queued",
                  "active_stage": "queued",
                  "budget": 1,
                  "seed_source_snapshot": seed_source,
                  "config": {
                      "venue": dataset.venue,
                      "symbol": dataset.symbol,
                      "timeframe": dataset.timeframe,
                      "from_ts": dataset.from_ts,
                      "as_of": dataset.as_of,
                      "initial_cash": 10000.0,
                      "fee_rate": 0.001,
                      "validation_split": 0.5,
                      "trading_mode": "spot",
                      "leverage": 1.0,
                      "funding_rate": 0.0,
                      "params": {},
                  },
                  "llm_snapshot": llm_snapshot,
                  "llm_config_digest": llm_config_digest,
                  "llm_credential_grant": (
                      "deterministic-test-grant-" + "x" * 120
                  ),
                  "llm_credential_grant_required": True,
                  "llm_snapshot_required": True,
                  "created_at": datetime.now(timezone.utc),
              }

              async with get_conn() as conn:
                  await runs.insert_run(conn, run)

              async with get_conn() as conn:
                  claimed = await run_queries.claim_next(conn)

              assert claimed is not None, "queued run was not claimed"
              assert str(claimed["run_id"]) == str(run_id)

              await execute_frozen_run(
                  claimed,
                  dataset=dataset,
                  mutator=mutator,
              )

              async with get_conn() as conn:
                  async with conn.cursor() as cur:
                      await cur.execute(
                          """
                          SELECT *
                          FROM strategy_evo_runs
                          WHERE run_id=%s
                          """,
                          (run_id,),
                      )
                      final_run = await cur.fetchone()

              assert final_run is not None
              assert final_run["status"] == "completed"

              async with get_conn() as conn:
                  candidate_rows = await candidates.list_candidates(
                      conn,
                      run_id,
                      claimed["owner_account_id"],
                  )

              assert len(candidate_rows) == 1

              candidate = candidate_rows[0]

              assert candidate["outcome"] == "succeeded"
              assert candidate["evaluation_snapshot"] is not None
              assert candidate["fitness"] is not None
              assert candidate["overfitting_risk"] is not None

              evaluation_snapshot = candidate["evaluation_snapshot"]

              result = {
                  "run_id": str(run_id),
                  "testing_ground_revision": TESTING_GROUND_REVISION,
                  "inalpha_revision": INALPHA_REVISION,
                  "workflow_run": WORKFLOW_RUN,
                  "status": final_run["status"],
                  "environment": {
                      "execution": "GitHub Actions",
                      "database": "TimescaleDB",
                      "database_scope": "disposable test database",
                      "llm_provider_invoked": False,
                  },
                  "dataset": {
                      "type": "synthetic",
                      "venue": dataset.venue,
                      "symbol": dataset.symbol,
                      "timeframe": dataset.timeframe,
                      "bar_count": len(dataset.bars),
                      "data_epoch": dataset.data_epoch,
                      "content_sha256": dataset.content_sha256,
                  },
                  "seed": {
                      "source_sha256": hashlib.sha256(
                          seed_source.encode()
                      ).hexdigest(),
                      "snapshot": final_run["seed_report_snapshot"],
                      "baseline_snapshot": final_run["baseline_snapshot"],
                  },
                  "candidate": {
                      "count": len(candidate_rows),
                      "outcome": candidate["outcome"],
                      "source_sha256": candidate["source_hash"],
                      "evaluation_snapshot": evaluation_snapshot,
                      "fitness": candidate["fitness"],
                      "overfitting_risk": candidate["overfitting_risk"],
                      "validation": (
                          evaluation_snapshot.get("validation")
                          if isinstance(evaluation_snapshot, dict)
                          else None
                      ),
                      "mutation_calls": mutator.calls,
                  },
                  "verified_boundaries": [
                      "queued run persistence",
                      "real DB queue claim",
                      "real execute_frozen_run",
                      "real seed evaluation",
                      "real baseline evaluation",
                      "deterministic mutation boundary",
                      "real AST audit",
                      "real candidate persistence",
                      "real candidate worker evaluation",
                      "real fitness",
                      "real validation",
                      "real overfitting-risk classification",
                      "real candidate/run finalization",
                  ],
                  "observations": [
                      "The managed E1 execution path completed successfully.",
                      "The test crossed the real database queue, candidate persistence, evaluation, and finalization boundaries.",
                      "The LLM mutation boundary was replaced by a deterministic mutator, so this run does not verify live LLM mutation.",
                      "The dataset was synthetic, so fitness and overfitting classification are execution evidence rather than evidence of strategy quality.",
                      "The production DataClient and FrozenBarsLoader path was intentionally bypassed by injecting a controlled FrozenDataset.",
                      "The preserved dataset hash is computed from the exact synthetic bar fixture used by this run.",
                  ],
                  "source_artifact": {
                      "name": "inalpha-e1-managed-run-output",
                      "workflow_run": (
                          int(WORKFLOW_RUN)
                          if WORKFLOW_RUN.isdigit()
                          else WORKFLOW_RUN
                      ),
                  },
              }

              output = json.dumps(
                  result,
                  indent=2,
                  default=str,
              )

              print(output)

              Path(
                  "../../../inalpha-e1-managed-run-output.json"
              ).write_text(
                  output + "\n",
                  encoding="utf-8",
              )


          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Run managed E1 harness
        working-directory: inalpha/services/evolver
        env:
          DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
          TESTING_GROUND_REVISION: ${{ github.sha }}
          INALPHA_REVISION: 3da8b103d61fc3c6af82ea479beade0cd7436e57
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail
          uv run python /tmp/inalpha_e1_managed_run.py \
            2>&1 | tee ../../../inalpha-e1-managed-run-output.txt

      - name: Upload managed run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inalpha-e1-managed-run-output
          path: |
            inalpha-e1-managed-run-output.txt
            inalpha-e1-managed-run-output.json
          if-no-files-found: warn