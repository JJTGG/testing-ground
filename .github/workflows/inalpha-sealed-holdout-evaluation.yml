name: Inalpha Sealed Holdout Evaluation

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: inalpha
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quant -d inalpha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: 3da8b103d61fc3c6af82ea479beade0cd7436e57
          path: inalpha

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install migration dependencies
        working-directory: inalpha/infra/migrations
        run: uv sync --group dev

      - name: Create disposable test database
        env:
          PGPASSWORD: devpass
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5433 \
            -U quant \
            -d inalpha \
            -c 'CREATE DATABASE inalpha_test;'

      - name: Run Inalpha migrations
        working-directory: inalpha/infra/migrations
        env:
          DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
        run: |
          uv run alembic upgrade head

      - name: Install Evolver dependencies
        working-directory: inalpha/services/evolver
        run: uv sync --group dev

      - name: Install Paper dependencies
        working-directory: inalpha/services/paper
        run: uv sync --group dev

      - name: Write sealed holdout evaluation audit
        run: |
          cat > inalpha/services/evolver/sealed-holdout-evaluation-audit.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from contextlib import asynccontextmanager
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from uuid import UUID, uuid4

          import pytest
          import pytest_asyncio
          from psycopg import AsyncConnection
          from psycopg.rows import dict_row

          from inalpha_paper.kernel.identifiers import InstrumentId
          from inalpha_paper.model.data import Bar

          from inalpha_evolver.config import EvolverSettings
          from inalpha_evolver.data.manifest import (
              BackfillSnapshot,
              DatasetManifest,
              FrozenDataset,
          )
          from inalpha_evolver.data.persistent_snapshot import (
              discovery_dataset,
              persist_loop_data_snapshot,
          )
          from inalpha_evolver.governor.seed import SEED_STRATEGY_CODE
          from inalpha_evolver.hypothesis.compiler import compile_hypothesis
          from inalpha_evolver.hypothesis.models import HypothesisSpec
          from inalpha_evolver.runtime import campaign as runtime
          from inalpha_evolver.runtime import loop_campaign
          from inalpha_evolver.storage import (
              campaigns,
              loop_authorizations,
              loop_dispatch,
              loops,
              runs,
          )
          from inalpha_evolver.api import loop_start


          DATABASE_URL = (
              "postgresql://quant:devpass@127.0.0.1:5433/inalpha_test"
          )

          RESULT_PATH = Path("sealed-holdout-evaluation-result.json")


          VALID_LLM_SNAPSHOT = {
              "config_id": "config-1",
              "provider": "deepseek",
              "model": "deepseek-flash",
              "base_url": "https://api.deepseek.com",
              "pricing": {
                  "version": "provider-estimate-2026-09",
                  "currency": "USD",
                  "input_usd_per_million": 0.3,
                  "output_usd_per_million": 1.2,
                  "assumed_input_tokens": 24000,
                  "max_output_tokens": 8192,
                  "estimated_max_usd_per_candidate": 0.0170304,
              },
              "config_digest": (
                  "e6edd79eabdccaed743ac72ddeb8ff4d5de550a742e9e931d368c93caf1cca4c"
              ),
          }


          def dataset() -> FrozenDataset:
              """
              Deterministic 10-bar FrozenDataset.

              Inalpha's production E2 snapshot machinery derives:
                discovery = 60%
                validation = 80%
                sealed holdout = final 20%

              Therefore this fixture intentionally produces:
                discovery: bars 0..5
                validation: bars 6..7
                holdout: bars 8..9
              """
              start = datetime(2026, 1, 1, tzinfo=UTC)
              instrument = InstrumentId(
                  symbol="BTC/USDT",
                  venue="binance",
              )

              bars = tuple(
                  Bar(
                      instrument_id=instrument,
                      timeframe="1h",
                      open=100 + index,
                      high=101 + index,
                      low=99 + index,
                      close=100.5 + index,
                      volume=1_000 + index,
                      ts_open=int(
                          (start + timedelta(hours=index)).timestamp() * 1e9
                      ),
                      ts_event=int(
                          (start + timedelta(hours=index + 1)).timestamp() * 1e9
                      ),
                      ts_init=int(
                          (start + timedelta(hours=index + 1)).timestamp() * 1e9
                      ),
                  )
                  for index in range(10)
              )

              manifest = DatasetManifest(
                  venue="binance",
                  symbol="BTC/USDT",
                  requested_timeframe="1h",
                  data_timeframe="1h",
                  canonical_timeframe="1h",
                  requested_from=start,
                  requested_as_of=start + timedelta(hours=11),
                  effective_from=start,
                  effective_to=start + timedelta(hours=9),
                  latest_bar_ts=start + timedelta(hours=9),
                  cutoff_bar_ts=start + timedelta(hours=9),
                  freshness_lag_seconds=0,
                  data_epoch=1,
                  bar_count=10,
                  annualization_periods=8_760,
                  calendar_code=None,
                  content_sha256="a" * 64,
                  backfill=BackfillSnapshot(
                      venue="binance",
                      symbol="BTC/USDT",
                      timeframe="1h",
                      bars_fetched=10,
                      bars_inserted=10,
                      from_ts=start,
                      to_ts=start + timedelta(hours=11),
                  ),
              )

              return FrozenDataset(
                  bars=bars,
                  manifest=manifest,
              )


          def make_request(target_id: UUID):
              config = {
                  "venue": "binance",
                  "symbol": "BTCUSDT",
                  "timeframe": "1h",
                  "from_ts": "2026-01-01T00:00:00Z",
                  "as_of": "2026-02-01T00:00:00Z",
                  "trading_mode": "perp",
              }

              return loop_start.StartEvolutionLoopRequest.model_validate(
                  {
                      "baseline": {
                          "seed_strategy_id": "sma_cross_v1",
                          "config": config,
                          "llm": VALID_LLM_SNAPSHOT,
                      },
                      "campaign": {
                          "event_snapshot_id": str(uuid4()),
                          "target_kind": "backtest_run",
                          "target_id": str(target_id),
                          "config": {
                              **config,
                              "asset_id": "asset:BTC",
                              "event_asset_code": "BTC",
                          },
                          "llm": VALID_LLM_SNAPSHOT,
                      },
                      "max_cost_usd": 1,
                  }
              )


          @pytest_asyncio.fixture
          async def database():
              async with await AsyncConnection.connect(
                  DATABASE_URL,
                  row_factory=dict_row,
              ) as conn:
                  async with conn.transaction(force_rollback=True):
                      yield conn


          async def build_ready_loop(database):
              """
              Reconstruct the minimum pre-campaign state using Inalpha's
              production persistence APIs.

              This intentionally does not import any Inalpha test fixture.
              """

              owner = uuid4()
              body = make_request(uuid4())

              run, _ = await runs.insert_run(
                  database,
                  owner_account_id=owner,
                  requested_by_sub=str(owner),
                  idempotency_key=str(uuid4()),
                  request_hash="a" * 64,
                  seed_strategy_id="sma_cross_v1",
                  seed_source=SEED_STRATEGY_CODE,
                  seed_hash=hashlib.sha256(
                      SEED_STRATEGY_CODE.encode()
                  ).hexdigest(),
                  budget=4,
                  config=body.baseline.config.model_dump(mode="json"),
                  llm_snapshot=VALID_LLM_SNAPSHOT,
                  llm_credential_grant="test-grant-" + "x" * 120,
                  queued_at=datetime.now(UTC),
              )

              args = {
                  "owner_account_id": owner,
                  "requested_by_sub": str(owner),
                  "operation_id": str(uuid4()),
                  "target_kind": body.campaign.target_kind,
                  "target_id": body.campaign.target_id,
                  "target_snapshot": {},
                  "e1_run_id": run["run_id"],
                  "frozen_config": {
                      **body.baseline.config.model_dump(mode="json"),
                      "campaign_request": body.campaign.model_dump(
                          mode="json"
                      ),
                      "protection_policy": {
                          "version": "paper-protection-v1",
                          "protective_stop_loss_pct": 0.2,
                      },
                  },
                  "budget": {
                      "e1_candidates": 4,
                  },
              }

              loop = await loops.ensure_for_e1_run(
                  database,
                  **args,
              )

              await loop_authorizations.register(
                  database,
                  loop_id=loop["loop_id"],
                  owner_account_id=owner,
                  request_digest="a" * 64,
                  max_cost_usd=1,
              )

              worker = await loop_dispatch.claim_next(
                  database,
                  worker_id="testing-ground-sealed-holdout",
                  ttl_s=300,
              )

              frozen = await persist_loop_data_snapshot(
                  database,
                  loop_id=loop["loop_id"],
                  owner_account_id=owner,
                  lease_token=worker["lease_token"],
                  dataset=dataset(),
              )

              report = {
                  "sharpe": 0.5,
                  "num_bars": 6,
                  "num_trades": 0,
                  "total_return_pct": 0,
              }

              await database.execute(
                  """
                  UPDATE strategy_evo_runs
                  SET
                      status='completed',
                      config=%s,
                      dataset_manifest=%s,
                      seed_report_snapshot=%s,
                      baseline_snapshot=%s
                  WHERE run_id=%s
                  """,
                  (
                      json.dumps(
                          {
                              **body.baseline.config.model_dump(
                                  mode="json"
                              ),
                              "protection_policy": args[
                                  "frozen_config"
                              ]["protection_policy"],
                          }
                      ),
                      discovery_dataset(
                          frozen
                      ).manifest.model_dump_json(),
                      json.dumps(report),
                      json.dumps(report),
                      args["e1_run_id"],
                  ),
              )

              await loop_dispatch.complete_step(
                  database,
                  loop_id=loop["loop_id"],
                  owner_account_id=owner,
                  lease_token=worker["lease_token"],
                  step_key="baseline",
                  output_id=args["e1_run_id"],
              )

              snapshot_id = body.campaign.event_snapshot_id

              await database.execute(
                  """
                  INSERT INTO market_event_snapshots(
                      snapshot_id,
                      cutoff,
                      policy_version,
                      query_hash,
                      events_sha256,
                      fact_count
                  )
                  VALUES(
                      %s,
                      %s,
                      'testing-ground-sealed-v1',
                      %s,
                      %s,
                      1
                  )
                  """,
                  (
                      snapshot_id,
                      body.campaign.config.as_of,
                      hashlib.sha256(
                          str(snapshot_id).encode()
                      ).hexdigest(),
                      "a" * 64,
                  ),
              )

              event_snapshot = {
                  "snapshot_id": str(snapshot_id),
                  "cutoff": body.campaign.config.as_of.isoformat(),
                  "policy_version": "testing-ground-sealed-v1",
                  "events_sha256": "a" * 64,
                  "fact_count": 1,
                  "asset_ids": ["asset:BTC"],
                  "facts": [
                      {
                          "fact_id": str(uuid4()),
                          "event_type": "listing",
                          "severity": 0.8,
                          "available_at": "2026-01-01T09:00:00Z",
                      }
                  ],
              }

              return (
                  worker,
                  frozen,
                  event_snapshot,
              )


          class FakeDataClient:
              """
              Controlled replacement for only Inalpha's external event
              snapshot HTTP dependency.

              The actual sealed holdout evaluator remains untouched.
              """

              event_snapshot = None

              def __init__(self, *args, **kwargs):
                  self.args = args
                  self.kwargs = kwargs

              async def __aenter__(self):
                  return self

              async def __aexit__(self, exc_type, exc, tb):
                  return False

              async def get_event_snapshot(self, snapshot_id):
                  assert self.event_snapshot is not None

                  snapshot = dict(self.event_snapshot)

                  assert snapshot["snapshot_id"] == str(snapshot_id)

                  return snapshot


          @pytest.mark.asyncio
          async def test_real_sealed_holdout_evaluation(
              database,
              monkeypatch,
          ):
              worker, frozen, event_snapshot = await build_ready_loop(
                  database
              )

              owner = worker["owner_account_id"]

              @asynccontextmanager
              async def connection():
                  yield database

              monkeypatch.setattr(
                  runtime,
                  "get_conn",
                  connection,
              )

              monkeypatch.setattr(
                  loop_campaign,
                  "get_conn",
                  connection,
              )

              async def fetch_event_snapshot(
                  snapshot_id,
                  **kwargs,
              ):
                  assert str(snapshot_id) == event_snapshot["snapshot_id"]
                  return event_snapshot

              monkeypatch.setattr(
                  loop_campaign,
                  "fetch_event_snapshot",
                  fetch_event_snapshot,
              )

              settings = EvolverSettings(
                  database_url=DATABASE_URL,
                  event_evolution_enabled=True,
                  jwt_secret=(
                      "testing-ground-sealed-holdout-secret-32-bytes"
                  ),
                  evolver_job_timeout_s=120,
                  evolver_job_mem_gb=2,
              )

              campaign_id = await loop_campaign.handoff_campaign(
                  worker,
                  settings,
              )

              campaign = await campaigns.get_campaign(
                  database,
                  campaign_id,
                  owner,
              )

              assert campaign is not None
              assert campaign["data_snapshot_id"] == frozen["snapshot_id"]

              lease = await campaigns.acquire_lease(
                  database,
                  campaign_id,
                  worker_id="testing-ground-sealed-holdout",
                  ttl_s=300,
              )

              assert lease is not None

              campaign = await campaigns.get_campaign(
                  database,
                  campaign_id,
                  owner,
              )

              hypothesis_row = campaign["hypotheses"][0]

              hypothesis = HypothesisSpec.model_validate(
                  hypothesis_row["spec"]
              )

              compiled = compile_hypothesis(hypothesis)

              implementation = await campaigns.insert_implementation(
                  database,
                  campaign_id=campaign_id,
                  hypothesis_id=hypothesis_row["hypothesis_id"],
                  generation=int(
                      hypothesis_row["generation"]
                  ),
                  profile="testing-ground-sealed-holdout",
                  source_code=compiled.source_code,
                  source_hash=compiled.source_hash,
                  lease_token=lease["lease_token"],
              )

              assert implementation is not None

              await database.execute(
                  """
                  UPDATE evolution_campaigns
                  SET
                      status='holdout_ready',
                      locked_candidate_id=%s,
                      active_generation=max_generations,
                      updated_at=clock_timestamp()
                  WHERE campaign_id=%s
                    AND owner_account_id=%s
                    AND status='replaying'
                    AND lease_token=%s
                  """,
                  (
                      implementation["implementation_id"],
                      campaign_id,
                      owner,
                      lease["lease_token"],
                  ),
              )

              campaign = await campaigns.get_campaign(
                  database,
                  campaign_id,
                  owner,
              )

              assert campaign["status"] == "holdout_ready"

              assert (
                  campaign["locked_candidate_id"]
                  == implementation["implementation_id"]
              )

              FakeDataClient.event_snapshot = event_snapshot

              monkeypatch.setattr(
                  runtime,
                  "DataClient",
                  FakeDataClient,
              )

              # Real production holdout state-machine branch.
              await runtime.execute_campaign(
                  campaign,
                  settings,
              )

              final_campaign = await campaigns.get_campaign(
                  database,
                  campaign_id,
                  owner,
              )

              assert final_campaign is not None

              assert final_campaign["status"] in {
                  "graduated",
                  "rejected",
              }

              assert (
                  final_campaign["holdout_consumed_at"]
                  is not None
              )

              attempt_id = final_campaign["holdout_attempt_id"]

              assert attempt_id is not None

              async with database.cursor() as cur:
                  await cur.execute(
                      """
                      SELECT
                          attempt_id,
                          campaign_id,
                          candidate_id,
                          status,
                          passed,
                          evidence
                      FROM evolution_holdout_attempts
                      WHERE attempt_id=%s
                      """,
                      (attempt_id,),
                  )

                  attempt = await cur.fetchone()

              assert attempt is not None

              assert attempt["campaign_id"] == campaign_id

              assert (
                  attempt["candidate_id"]
                  == implementation["implementation_id"]
              )

              assert attempt["status"] in {
                  "succeeded",
                  "failed",
              }

              assert attempt["evidence"] is not None

              evidence = attempt["evidence"]

              assert "sealed_holdout" in evidence
              assert "holdout_passed" in evidence

              holdout_evidence = evidence["sealed_holdout"]

              assert (
                  holdout_evidence["source_hash"]
                  == hashlib.sha256(
                      compiled.source_code.encode()
                  ).hexdigest()
              )

              assert (
                  holdout_evidence["snapshot_id"]
                  == str(campaign["event_snapshot_id"])
              )

              assert "metrics" in holdout_evidence
              assert "event_study" in holdout_evidence
              assert "thresholds" in holdout_evidence

              metrics = holdout_evidence["metrics"]

              assert "sharpe" in metrics
              assert "total_return_pct" in metrics
              assert "max_drawdown_pct" in metrics
              assert "num_trades" in metrics
              assert "num_bars" in metrics

              # 10 immutable bars × 0.8 validation split
              # means the actual sealed holdout contains bars 8 and 9.
              assert metrics["num_bars"] == 2

              # Re-execute the same campaign object. The production
              # state machine must not consume a second holdout attempt.
              await runtime.execute_campaign(
                  campaign,
                  settings,
              )

              async with database.cursor() as cur:
                  await cur.execute(
                      """
                      SELECT count(*) AS count
                      FROM evolution_holdout_attempts
                      WHERE campaign_id=%s
                      """,
                      (campaign_id,),
                  )

                  count_row = await cur.fetchone()

              assert count_row["count"] == 1

              result = {
                  "status": "completed",
                  "test": "e2-real-sealed-holdout-evaluation",
                  "inalpha_revision": (
                      "3da8b103d61fc3c6af82ea479beade0cd7436e57"
                  ),
                  "campaign_id": str(campaign_id),
                  "attempt_id": str(attempt_id),
                  "candidate_id": str(
                      implementation["implementation_id"]
                  ),
                  "candidate_source_hash": hashlib.sha256(
                      compiled.source_code.encode()
                  ).hexdigest(),
                  "dataset": {
                      "bars": len(frozen["compressed_payload"]),
                      "frozen_bar_count": 10,
                      "discovery_end": 6,
                      "validation_end": 8,
                      "sealed_holdout_bars": 2,
                  },
                  "verified": {
                      "production_campaign_handoff": True,
                      "immutable_campaign_snapshot_used": True,
                      "real_execute_campaign_holdout_branch": True,
                      "real_sealed_holdout_evaluator": True,
                      "real_frozen_dataset_evaluator": True,
                      "real_killable_engine_runner": True,
                      "locked_candidate_identity_preserved": True,
                      "final_holdout_metrics_produced": True,
                      "sealed_holdout_evidence_persisted": True,
                      "holdout_consumed_once": True,
                      "second_execution_did_not_create_new_attempt": True,
                  },
                  "metrics": metrics,
                  "terminal_campaign_status": final_campaign[
                      "status"
                  ],
                  "limitations": [
                      (
                          "The market dataset is synthetic and therefore "
                          "does not establish strategy quality or real-market "
                          "performance."
                      ),
                      (
                          "The external event snapshot HTTP boundary was "
                          "replaced with a deterministic fixture."
                      ),
                      (
                          "The test verifies the actual sealed evaluation "
                          "machinery, not production data-service behavior."
                      ),
                  ],
              }

              RESULT_PATH.write_text(
                  json.dumps(
                      result,
                      indent=2,
                      default=str,
                  )
                  + "\n",
                  encoding="utf-8",
              )

              print(
                  json.dumps(
                      result,
                      indent=2,
                      default=str,
                  )
              )
          PY

      - name: Run real sealed holdout evaluation
        working-directory: inalpha/services/evolver
        env:
          EVOLVER_TEST_DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
          DATABASE_URL: postgresql+psycopg://quant:devpass@127.0.0.1:5433/inalpha_test
        run: |
          set -o pipefail
          uv run pytest \
            sealed-holdout-evaluation-audit.py \
            -v \
            2>&1 | tee sealed-holdout-evaluation-output.txt

      - name: Preserve result in Testing Ground
        if: success()
        run: |
          mkdir -p experiments/inalpha/results

          cp \
            inalpha/services/evolver/sealed-holdout-evaluation-result.json \
            "experiments/inalpha/results/e2-sealed-holdout-evaluation-${GITHUB_RUN_ID}.json"

          cp \
            inalpha/services/evolver/sealed-holdout-evaluation-output.txt \
            "experiments/inalpha/results/e2-sealed-holdout-evaluation-${GITHUB_RUN_ID}.txt"

      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inalpha-e2-sealed-holdout-evaluation
          path: |
            inalpha/services/evolver/sealed-holdout-evaluation-result.json
            inalpha/services/evolver/sealed-holdout-evaluation-output.txt
            experiments/inalpha/results/e2-sealed-holdout-evaluation-${{ github.run_id }}.json
            experiments/inalpha/results/e2-sealed-holdout-evaluation-${{ github.run_id }}.txt