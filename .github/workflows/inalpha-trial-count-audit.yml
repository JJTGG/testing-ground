name: Inalpha Trial Count Audit

on:
  workflow_dispatch:

jobs:
  trial-count-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Testing Ground
        uses: actions/checkout@v4

      - name: Checkout Inalpha
        uses: actions/checkout@v4
        with:
          repository: mirror29/inalpha
          ref: 3da8b103d61fc3c6af82ea479beade0cd7436e57
          path: inalpha

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Paper dependencies
        working-directory: inalpha/services/paper
        run: uv sync --group dev

      - name: Create trial-count audit harness
        working-directory: inalpha/services/paper
        run: |
          cat > /tmp/test_trial_count_audit.py <<'PY'
          from __future__ import annotations

          import asyncio
          import inspect
          import math
          from datetime import UTC, datetime, timedelta
          from typing import Any

          from inalpha_paper.engine.backtest import BacktestEngine
          from inalpha_paper.engine.robustness import deflated_sharpe_ratio
          from inalpha_paper.kernel.identifiers import InstrumentId
          from inalpha_paper.model.data import Bar
          from inalpha_paper.strategy_evaluation import evaluate_strategy_source


          CANDIDATE_SOURCE = """
          class TrialAuditStrategy(Strategy):
              def __init__(
                  self,
                  name,
                  clock,
                  msgbus,
                  instrument_id,
                  timeframe="1h",
              ):
                  super().__init__(name, clock, msgbus)
                  self._instrument_id = instrument_id
                  self._timeframe = timeframe
                  self._entered = False

              def on_start(self):
                  self.subscribe_bars(self._instrument_id, self._timeframe)

              def on_bar(self, bar):
                  if bar.instrument_id != self._instrument_id:
                      return

                  if not self._entered:
                      order = Order(
                          client_order_id=ClientOrderId(
                              "trial-audit-" + uuid4().hex[:8]
                          ),
                          instrument_id=self._instrument_id,
                          side=OrderSide.BUY,
                          type=OrderType.MARKET,
                          quantity=0.01,
                      )
                      self.submit_order(order)
                      self._entered = True

              def on_position_opened(self, event):
                  pass

              def on_position_closed(self, event):
                  pass
          """


          def build_bars(
              count: int = 60,
          ) -> tuple[InstrumentId, list[Bar]]:
              instrument_id = InstrumentId(
                  symbol="BTC/USDT",
                  venue="binance",
              )

              base_ts = int(
                  datetime(
                      2026,
                      1,
                      1,
                      tzinfo=UTC,
                  ).timestamp()
                  * 1_000_000_000
              )

              interval_ns = int(
                  timedelta(hours=1).total_seconds()
                  * 1_000_000_000
              )

              bars: list[Bar] = []

              for index in range(count):
                  price = 100.0 + 8.0 * math.sin(index * 0.35)

                  bars.append(
                      Bar(
                          instrument_id=instrument_id,
                          timeframe="1h",
                          open=price,
                          high=price + 0.5,
                          low=price - 0.5,
                          close=price,
                          volume=1.0,
                          ts_event=base_ts + index * interval_ns,
                          ts_init=base_ts + index * interval_ns,
                      )
                  )

              return instrument_id, bars


          async def real_engine(**kwargs: Any):
              from inalpha_paper.strategy_authoring import (
                  load_strategy_class,
                  verify_strategy_contract,
              )

              source = kwargs["candidate_code"]
              bars = kwargs["bars"]
              instrument_id = kwargs["instrument_id"]

              strategy_class = load_strategy_class(source)
              verify_strategy_contract(strategy_class)

              engine = BacktestEngine(
                  initial_cash=kwargs["initial_cash"],
                  fee_rate=kwargs["fee_rate"],
              )

              strategy = strategy_class(
                  name="trial-count-audit",
                  clock=engine.clock,
                  msgbus=engine.msgbus,
                  instrument_id=instrument_id,
                  timeframe=kwargs["timeframe"],
              )

              engine.add_strategy(strategy)

              return engine.run(bars)


          async def evaluate_candidate(
              instrument_id: InstrumentId,
              bars: list[Bar],
          ):
              return await evaluate_strategy_source(
                  source_code=CANDIDATE_SOURCE,
                  bars=bars,
                  instrument_id=instrument_id,
                  timeframe="1h",
                  run_engine=real_engine,
                  initial_cash=10_000.0,
                  fee_rate=0.001,
                  validation_split=0.3,
                  annualization_periods=8760.0,
              )


          async def main() -> None:
              print("═══════════════════════════════════════════════════════")
              print(" Inalpha Evolution Trial-Count Audit")
              print("═══════════════════════════════════════════════════════")

              # ----------------------------------------------------------
              # 1. Inspect the actual E1 evaluation API.
              # ----------------------------------------------------------

              signature = inspect.signature(evaluate_strategy_source)
              parameter_names = set(signature.parameters)

              print()
              print("───────────────────────────────────────────────────────")
              print(" E1 Evaluation API")
              print("───────────────────────────────────────────────────────")
              print(f"  parameters = {sorted(parameter_names)}")

              trial_parameters = {
                  "n_strategies",
                  "trial_count",
                  "candidate_count",
                  "num_candidates",
                  "search_count",
                  "n_trials",
              }

              exposed_trial_parameters = parameter_names & trial_parameters

              assert not exposed_trial_parameters, (
                  "E1 evaluator unexpectedly exposes trial-count parameters: "
                  f"{sorted(exposed_trial_parameters)}"
              )

              print("  trial-count parameter = NOT EXPOSED")
              print("  ✅ E1 evaluator has no explicit evolutionary trial-count input")

              # ----------------------------------------------------------
              # 2. Show that DSR itself responds to trial count.
              # ----------------------------------------------------------

              observed_sharpe = 2.0
              n_returns = 252

              dsr_one = deflated_sharpe_ratio(
                  observed_sharpe=observed_sharpe,
                  n_returns=n_returns,
                  n_strategies=1,
              )

              dsr_ten = deflated_sharpe_ratio(
                  observed_sharpe=observed_sharpe,
                  n_returns=n_returns,
                  n_strategies=10,
              )

              print()
              print("───────────────────────────────────────────────────────")
              print(" DSR Sensitivity")
              print("───────────────────────────────────────────────────────")
              print(f"  observed Sharpe = {observed_sharpe}")
              print(f"  n_strategies=1  → p={dsr_one.p_value:.8f}")
              print(f"  n_strategies=10 → p={dsr_ten.p_value:.8f}")
              print(
                  f"  expected max Sharpe (1)  = "
                  f"{dsr_one.expected_max_sharpe:.8f}"
              )
              print(
                  f"  expected max Sharpe (10) = "
                  f"{dsr_ten.expected_max_sharpe:.8f}"
              )

              assert (
                  dsr_one.expected_max_sharpe
                  != dsr_ten.expected_max_sharpe
              )

              print("  ✅ DSR changes when the strategy count changes")

              # ----------------------------------------------------------
              # 3. Execute the actual E1 candidate evaluator.
              #
              # The evaluator receives no candidate/trial-count argument.
              # Therefore the same source + same frozen data produce the
              # same EvaluationSnapshot regardless of how many evolutionary
              # slots may have existed outside this function.
              # ----------------------------------------------------------

              instrument_id, bars = build_bars()

              first = await evaluate_candidate(instrument_id, bars)
              second = await evaluate_candidate(instrument_id, bars)

              first_snapshot = first.snapshot.model_dump(mode="json")
              second_snapshot = second.snapshot.model_dump(mode="json")

              print()
              print("───────────────────────────────────────────────────────")
              print(" E1 Candidate Evaluation")
              print("───────────────────────────────────────────────────────")
              print(f"  bars                 = {first.report.num_bars_processed}")
              print(f"  trades               = {first.report.num_trades}")
              print(f"  fitness              = {first.snapshot.fitness}")
              print(
                  "  validation present   = "
                  f"{first.snapshot.validation is not None}"
              )
              print(
                  "  candidate result #1  = "
                  f"{first_snapshot}"
              )
              print(
                  "  candidate result #2  = "
                  f"{second_snapshot}"
              )

              assert first_snapshot == second_snapshot

              print("  ✅ Candidate evaluation is deterministic for fixed inputs")

              # ----------------------------------------------------------
              # 4. Explicit conclusion.
              # ----------------------------------------------------------

              print()
              print("═══════════════════════════════════════════════════════")
              print(" AUDIT RESULT")
              print("═══════════════════════════════════════════════════════")
              print()
              print("  DSR:")
              print("    ✅ Statistical correction accepts trial count")
              print("    ✅ Different trial counts produce different DSR expectations")
              print()
              print("  E1 candidate evaluation:")
              print("    ✅ Real candidate evaluation executed")
              print("    ✅ Evaluation API exposes no evolutionary trial count")
              print("    ✅ Candidate result is determined by candidate/data inputs")
              print()
              print("  CONCLUSION:")
              print(
                  "    The DSR implementation supports multiple-testing "
                  "correction, but the managed E1 candidate-evaluation "
                  "boundary does not expose the evolutionary candidate "
                  "count to that correction."
              )
              print()
              print(
                  "    This audit does NOT claim that the entire Inalpha "
                  "system lacks other statistical accounting. It establishes "
                  "the specific boundary tested here."
              )
              print()
              print("✅ Trial-count audit completed successfully")


          if __name__ == "__main__":
              asyncio.run(main())
          PY

      - name: Run trial-count audit
        working-directory: inalpha/services/paper
        run: |
          set -o pipefail

          uv run --quiet python /tmp/test_trial_count_audit.py \
            2>&1 | tee ../../../inalpha-trial-count-audit-output.txt

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inalpha-trial-count-audit-output
          path: inalpha-trial-count-audit-output.txt